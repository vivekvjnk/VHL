[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
log_cli = true
log_cli_level = INFO
log_cli_format = %(message)s
log_file_level = INFO
log_file_format = %(message)s
markers =
    e2e: End-to-end tests
    integration: Integration tests
    unit: Unit tests
    contract: Contract tests
